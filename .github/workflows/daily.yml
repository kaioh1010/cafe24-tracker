name: cafe24-daily-sales

on:
  schedule:
    # ?꾨궇 ?뺤젙移? 留ㅼ씪 KST 04:00 (UTC 19:00) - ?댁젣 ?좎쭨 ?섏쭛
    - cron: "0 19 * * *"
    # ?뱀씪 ?섏쭛: KST 09/12/15/18??(UTC 00/03/06/09?? - KST ?ㅻ뒛 ?섏쭛
    - cron: "0 0 * * *"
    - cron: "0 3 * * *"
    - cron: "0 6 * * *"
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "?섏쭛???좎쭨 (YYYY-MM-DD, 鍮꾩슦硫?KST ?ㅻ뒛)"
        required: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pynacl
      - name: ?섏쭛 ?좎쭨 寃곗젙
        id: pick
        run: |
          echo "event=${{ github.event_name }} schedule=[${{ github.event.schedule }}]"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "${{ github.event.schedule }}" = "0 19 * * *" ]; then
            # 04???뺤젙移??ㅼ?以? ?댁젣(KST) ?섏쭛
            echo "date=$(TZ=Asia/Seoul date -d 'yesterday' +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          else
            # ?뱀씪 ?ㅼ?以?諛??섎룞 ?ㅽ뻾: ?낅젰媛??곗꽑, ?놁쑝硫?tracker.py媛 KST ?ㅻ뒛 ?섏쭛
            echo "date=${{ github.event.inputs.target_date }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Run tracker
        env:
          MALL_ID: ${{ secrets.MALL_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          TARGET_DATE: ${{ steps.pick.outputs.date }}
        run: python tracker.py
      - name: Commit data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M) sales"
          git push
